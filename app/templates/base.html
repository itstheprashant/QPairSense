<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QPairSense{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="brand">QPairSense</div>
        <div class="tagline">Duplicate Question Intelligence</div>
    </header>

    <main class="container">

    </main>

    <footer>
        <span>QPairSense</span>
        <span>FastAPI · Jinja2 · NLP</span>
    </footer>

    <script src="{{ url_for('static', path='js/app.js') }}"></script>
</body>
</html>
